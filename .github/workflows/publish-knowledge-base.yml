name: Publish Knowledge Base

on:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-base-pages
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/knowledge-base-checks.yml

  build:
    name: Build website
    needs: quality
    if: github.repository == 'patricklfdm/knowledge-base' && github.ref == 'refs/heads/v5'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Install configured Quartz plugins
        run: npm run quartz -- plugin install --from-config

      - name: Build knowledge base
        run: npm run kb:build

      - name: Check deployed artifact links
        run: npm run kb:output

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    name: Deploy website
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
