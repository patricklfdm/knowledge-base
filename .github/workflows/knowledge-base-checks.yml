name: Knowledge Base Checks

on:
  pull_request:
    branches: [v5]
  push:
    branches-ignore: [v5]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up locked Java example runtime
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version-file: examples/java-basics/.java-version
      - name: Set up locked Python example runtime
        uses: actions/setup-python@v6
        with:
          python-version-file: examples/python-basics/.python-version
      - name: Install locked dependencies
        run: npm ci
      - name: Install locked TypeScript example dependencies
        run: npm ci --prefix examples/typed-trips
      - name: Install locked systems example dependencies
        run: npm ci --prefix examples/systems-basics
      - name: Install locked Python bridge dependencies
        run: npm ci --prefix examples/python-basics
      - name: Install locked reliable application dependencies
        run: npm ci --prefix examples/reliable-app
      - name: Install locked distributed lab manifest
        run: npm ci --prefix examples/distributed-lab
      - name: Install configured plugins
        run: npm run quartz -- plugin install --from-config
      - name: Verify content, negative fixtures, types, build and publication filters
        run: npm run kb:verify
      - name: Run inherited regression tests
        run: npm test
      - name: Ensure installation did not change the npm lock
        run: git diff --exit-code -- package.json package-lock.json examples/foundations/package.json examples/foundations/package-lock.json examples/typed-trips/package.json examples/typed-trips/package-lock.json examples/web-forms/package.json examples/web-forms/package-lock.json examples/http-trips/package.json examples/http-trips/package-lock.json examples/trip-api/package.json examples/trip-api/package-lock.json examples/sql-trips/package.json examples/sql-trips/package-lock.json examples/trip-app/package.json examples/trip-app/package-lock.json examples/java-basics/package.json examples/java-basics/package-lock.json examples/java-basics/.java-version examples/systems-basics/package.json examples/systems-basics/package-lock.json examples/python-basics/package.json examples/python-basics/package-lock.json examples/python-basics/.python-version examples/reliable-app/package.json examples/reliable-app/package-lock.json examples/distributed-lab/package.json examples/distributed-lab/package-lock.json
