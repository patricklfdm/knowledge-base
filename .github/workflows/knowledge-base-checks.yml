name: Knowledge Base Checks

on:
  pull_request:
    branches: [v5]
  push:
    branches-ignore: [v5]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install configured plugins
        run: npm run quartz -- plugin install --from-config
      - name: Verify content, negative fixtures, types, build and publication filters
        run: npm run kb:verify
      - name: Run inherited regression tests
        run: npm test
      - name: Ensure installation did not change the npm lock
        run: git diff --exit-code -- package.json package-lock.json
